name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run standalone tests
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/stephenberry/glaze.git /tmp/glaze
          git -C /tmp/glaze checkout 3bfd53e70db09247f3726a65abd7c7c2414a1601
          g++ -std=c++23 -Wall -Wextra -pedantic -Isrc tests/atomic_file.cpp -o /tmp/atomic-file-test
          g++ -std=c++23 -Wall -Wextra -pedantic -Isrc -I/tmp/glaze/include tests/keybind.cpp -o /tmp/keybind-test
          /tmp/atomic-file-test
          /tmp/keybind-test

  build:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
        - name: Windows
          os: windows-latest
          target: Win64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    # The Geode build action already drives sccache as the compiler launcher.
    # Storing the objects in the Actions cache keeps repeat Windows builds to
    # the few translation units that actually changed.
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # The action defaults to the runner's standalone clang, whose version is
    # older than the MSVC STL on this image requires. Switch the build to the
    # real MSVC (cl) by exporting the vcvars64 environment.
    - name: Set up MSVC environment
      id: msvc
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vsRoot = "C:\Program Files\Microsoft Visual Studio"
        $vcvars = Get-ChildItem "$vsRoot" -Recurse -Filter vcvars64.bat |
          Where-Object { $_.FullName -match 'VC\\Auxiliary\\Build' } |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if (-not $vcvars) { throw "vcvars64.bat not found" }

        $dump = cmd /c "`"$vcvars`" >nul && set"
        $seen = @{}
        foreach ($line in $dump) {
          if ($line -match '^([^=]+)=(.*)$') {
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir',
                            'WindowsSDKVersion', 'VCINSTALLDIR', 'VCToolsInstallDir',
                            'VisualStudioVersion', 'VSCMD_ARG_TGT_ARCH',
                            'ExtensionSdkDir', 'UCRTContentRoot', ' UniversalCRTSdkDir')) {
              if (-not $seen.ContainsKey($name)) {
                "$name=$value" >> $env:GITHUB_ENV
                $seen[$name] = $true
              }
            }
          }
        }
        "ok=1" >> $env:GITHUB_OUTPUT

    - name: Build Mod
      uses: geode-sdk/build-geode-mod@963ac394ad1773b6ea5b0f96aade52a44c6a4770
      env:
        CC: cl
        CXX: cl
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        sdk: given
        combine: true
        target: ${{ matrix.config.target }}
        configure-args: ${{ runner.os == 'Windows' && steps.msvc.outputs.ok == '1' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF' || '' }}

  package:
    name: Package Geode Mod
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod/combine@963ac394ad1773b6ea5b0f96aade52a44c6a4770
        id: build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mod Output
          path: ${{ steps.build.outputs.build-output }}
          retention-days: 3
